<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>天から届いた手紙｜光の詠唱</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  padding:28px 14px 48px;
  color:#554735;
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;

  background:
    radial-gradient(
      circle at 50% 25%,
      rgba(255,247,208,.8) 0%,
      rgba(255,249,229,.45) 22%,
      transparent 52%
    ),
    linear-gradient(
      180deg,
      #fbf7ef 0%,
      #f1e5d1 58%,
      #ead8bd 100%
    );

  transition:background 2.5s ease;
}

body.warm{
  background:
    radial-gradient(
      circle at 50% 28%,
      rgba(255,232,158,.88) 0%,
      rgba(255,245,213,.58) 28%,
      transparent 57%
    ),
    linear-gradient(
      180deg,
      #fffaf0 0%,
      #f4e6cd 58%,
      #ead5b5 100%
    );
}

/* ページ全体 */
.page{
  position:relative;
  z-index:2;
  width:min(740px,100%);
  margin:0 auto;
  text-align:center;
}

.page-title{
  margin:0 0 20px;
  color:#896938;
  font-size:clamp(22px,5vw,32px);
  font-weight:normal;
  letter-spacing:.16em;
  opacity:0;
  transform:translateY(10px);
  animation:titleIn 1s ease .15s forwards;
}

@keyframes titleIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* 背景の暖かな光 */
.heavenly-light{
  position:fixed;
  top:8%;
  left:50%;
  z-index:0;
  width:min(620px,96vw);
  aspect-ratio:1;
  pointer-events:none;
  border-radius:50%;
  opacity:.62;
  transform:translateX(-50%);
  background:
    radial-gradient(
      circle,
      rgba(255,244,191,.75) 0%,
      rgba(255,231,151,.28) 35%,
      transparent 70%
    );
  filter:blur(12px);
  animation:lightBreath 4.5s ease-in-out infinite;
}

@keyframes lightBreath{
  0%,100%{
    opacity:.48;
    transform:translateX(-50%) scale(.96);
  }

  50%{
    opacity:.78;
    transform:translateX(-50%) scale(1.05);
  }
}

/* キラキラ */
.sparkles{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}

.sparkle{
  position:absolute;
  color:rgba(201,153,65,.72);
  font-size:18px;
  opacity:0;
  animation:sparkle 4.8s ease-in-out infinite;
}

.sparkle:nth-child(1){
  top:18%;
  left:12%;
  animation-delay:.2s;
}

.sparkle:nth-child(2){
  top:30%;
  right:11%;
  font-size:13px;
  animation-delay:1.1s;
}

.sparkle:nth-child(3){
  top:53%;
  left:8%;
  font-size:12px;
  animation-delay:2.2s;
}

.sparkle:nth-child(4){
  top:61%;
  right:9%;
  font-size:17px;
  animation-delay:.7s;
}

.sparkle:nth-child(5){
  top:77%;
  left:18%;
  font-size:11px;
  animation-delay:3s;
}

.sparkle:nth-child(6){
  top:14%;
  right:26%;
  font-size:10px;
  animation-delay:2.7s;
}

.sparkle:nth-child(7){
  top:43%;
  left:22%;
  font-size:9px;
  animation-delay:1.7s;
}

@keyframes sparkle{
  0%,100%{
    opacity:0;
    transform:translateY(8px) scale(.65) rotate(0deg);
  }

  38%{
    opacity:.78;
  }

  55%{
    opacity:1;
    transform:translateY(-8px) scale(1.08) rotate(18deg);
  }

  76%{
    opacity:.2;
  }
}

/* 封筒と便箋の舞台 */
.envelope-stage{
  position:relative;
  width:min(670px,100%);
  min-height:710px;
  margin:0 auto;
  perspective:1600px;
}

/* 便箋の後ろから広がる光 */
.letter-glow{
  position:absolute;
  top:135px;
  left:50%;
  z-index:0;
  width:78%;
  height:420px;
  opacity:0;
  border-radius:50%;
  transform:translateX(-50%) scale(.76);
  background:
    radial-gradient(
      ellipse,
      rgba(255,227,145,.85) 0%,
      rgba(255,239,191,.4) 40%,
      transparent 72%
    );
  filter:blur(20px);
  transition:
    opacity 1.4s ease,
    transform 1.5s ease;
}

.envelope.open + .letter-glow{
  opacity:.9;
  transform:translateX(-50%) scale(1.08);
}

/* 封筒全体 */
.envelope{
  position:absolute;
  top:205px;
  left:50%;
  width:84%;
  height:285px;
  transform:translateX(-50%);
}

/* 封筒の後ろ */
.envelope-back{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  border:1px solid rgba(177,130,57,.45);
  border-radius:12px;
  background:
    linear-gradient(
      145deg,
      #f3dfb4 0%,
      #dfbd78 55%,
      #d5a75b 100%
    );
  box-shadow:
    0 18px 45px rgba(94,62,23,.22);
}

/* 封筒左右の折り目 */
.envelope-back::before,
.envelope-back::after{
  content:"";
  position:absolute;
  bottom:-58px;
  width:76%;
  height:128%;
  background:
    linear-gradient(
      145deg,
      #f4deb0,
      #e0bb75
    );
}

.envelope-back::before{
  left:-29%;
  transform:rotate(35deg);
}

.envelope-back::after{
  right:-29%;
  transform:rotate(-35deg);
}

/* 封筒前面 */
.envelope-front{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:6;
  height:57%;
  overflow:hidden;
  border-radius:0 0 12px 12px;
}

.envelope-front::before,
.envelope-front::after{
  content:"";
  position:absolute;
  bottom:-76px;
  width:77%;
  height:180%;
  background:
    linear-gradient(
      155deg,
      #f5e3bd,
      #dfbd7a
    );
}

.envelope-front::before{
  left:-24%;
  transform:rotate(36deg);
}

.envelope-front::after{
  right:-24%;
  transform:rotate(-36deg);
}

/* 封筒のふた */
.envelope-flap{
  position:absolute;
  top:0;
  left:6%;
  z-index:8;
  width:88%;
  height:166px;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transform:rotateX(0deg);
  background:
    linear-gradient(
      180deg,
      #efd7a5 0%,
      #d8ad63 100%
    );
  filter:drop-shadow(
    0 6px 8px rgba(83,51,15,.15)
  );
  transition:
    transform 1.15s cubic-bezier(.28,.72,.25,1),
    z-index 0s linear .55s;
}

/* 封筒中央の小さな光の印 */
.envelope-seal{
  position:absolute;
  top:80px;
  left:50%;
  z-index:10;
  display:grid;
  place-items:center;
  width:54px;
  height:54px;
  border:1px solid rgba(150,105,41,.65);
  border-radius:50%;
  color:#9d7135;
  font-size:22px;
  background:
    radial-gradient(
      circle,
      #fff8de 0%,
      #e7c985 72%
    );
  box-shadow:
    0 3px 12px rgba(91,55,16,.18);
  transform:translateX(-50%);
  transition:
    opacity .45s ease,
    transform .6s ease;
}

.envelope.open .envelope-seal{
  opacity:0;
  transform:translateX(-50%) scale(.65);
}

.envelope.open .envelope-flap{
  z-index:0;
  transform:rotateX(180deg);
}

/* 便箋 */
.letter{
  position:absolute;
  top:118px;
  left:50%;
  z-index:3;
  width:94%;
  min-height:540px;
  padding:
    57px
    clamp(27px,7vw,66px)
    50px;

  opacity:0;
  transform:
    translateX(-50%)
    translateY(125px)
    rotate(-.7deg)
    scale(.95);

  border:1px solid #e5cd98;
  background:
    linear-gradient(
      rgba(255,254,248,.94),
      rgba(255,252,242,.94)
    ),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 38px,
      rgba(184,151,91,.08) 39px
    );

  box-shadow:
    0 18px 46px rgba(84,59,25,.21);

  transition:
    opacity .8s ease,
    transform 1.4s cubic-bezier(.2,.78,.25,1);
}

.envelope.open .letter{
  z-index:5;
  opacity:1;
  transform:
    translateX(-50%)
    translateY(-165px)
    rotate(-.7deg)
    scale(1);
}

/* 便箋の二重金枠 */
.letter::before{
  content:"";
  position:absolute;
  inset:14px;
  pointer-events:none;
  border:1px solid rgba(205,161,76,.8);
}

.letter::after{
  content:"✦";
  position:absolute;
  top:3px;
  left:50%;
  padding:0 13px;
  color:#c18d35;
  font-size:19px;
  background:#fffdf7;
  transform:translateX(-50%);
}

/* 手紙の内容 */
.letter-content{
  opacity:0;
  transform:translateY(16px);
  transition:
    opacity 1.1s ease,
    transform 1.1s ease;
}

.envelope.show-content .letter-content{
  opacity:1;
  transform:translateY(0);
}

.letter-heading{
  margin:0 0 34px;
  color:#977038;
  font-size:clamp(20px,5vw,28px);
  font-weight:normal;
  letter-spacing:.16em;
}

.section{
  margin:0 0 38px;
  text-align:left;
}

.section-title{
  margin:0 0 15px;
  padding-bottom:8px;
  border-bottom:
    1px solid rgba(181,139,72,.4);
  color:#a37634;
  font-size:17px;
  font-weight:normal;
  letter-spacing:.12em;
}

.keywords{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.keyword{
  display:inline-block;
  padding:8px 15px;
  border:1px solid #d5b16a;
  border-radius:999px;
  color:#71542d;
  font-size:15px;
  background:rgba(255,249,234,.9);
}

.meaning{
  margin:0;
  color:#514536;
  font-size:clamp(16px,3.8vw,18px);
  line-height:2.18;
  text-align:left;
  white-space:pre-wrap;
}

.signature{
  margin:42px 0 0;
  color:#96713e;
  font-size:17px;
  letter-spacing:.18em;
  text-align:right;
}

/* 読み込み中表示 */
.status{
  position:absolute;
  top:50%;
  left:50%;
  z-index:20;
  width:90%;
  margin:0;
  color:#775a31;
  font-size:16px;
  line-height:1.9;
  transform:translate(-50%,-50%);
}

.status.hide{
  display:none;
}

/* ボタン */
.buttons{
  position:relative;
  z-index:10;
  margin-top:26px;
  opacity:0;
  transform:translateY(15px);
  transition:
    opacity .8s ease,
    transform .8s ease;
}

.buttons.show{
  opacity:1;
  transform:translateY(0);
}

.button{
  display:inline-block;
  min-width:150px;
  margin:6px;
  padding:13px 23px;
  border:1px solid #b68b48;
  border-radius:999px;
  color:#fff;
  font:inherit;
  text-decoration:none;
  background:#c4994e;
  cursor:pointer;
}

.secondary{
  color:#71552e;
  background:rgba(255,255,255,.58);
}

/* スマホ */
@media(max-width:520px){

  body{
    padding:24px 8px 38px;
  }

  .page-title{
    margin-bottom:12px;
  }

  .envelope-stage{
    min-height:700px;
  }

  .envelope{
    top:205px;
    width:96%;
    height:270px;
  }

  .envelope-flap{
    height:150px;
  }

  .envelope-seal{
    top:70px;
    width:48px;
    height:48px;
  }

  .letter{
    top:115px;
    width:96%;
    min-height:535px;
    padding:
      49px
      27px
      42px;
  }

  .envelope.open .letter{
    transform:
      translateX(-50%)
      translateY(-165px)
      rotate(-.5deg)
      scale(1);
  }

  .meaning{
    line-height:2;
  }

  .button{
    min-width:135px;
    padding:12px 18px;
  }

  .sparkle:nth-child(3),
  .sparkle:nth-child(7){
    display:none;
  }
}

/* 動きを減らす設定 */
@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<body>

<div class="heavenly-light"></div>

<div class="sparkles" aria-hidden="true">
  <span class="sparkle">✦</span>
  <span class="sparkle">✧</span>
  <span class="sparkle">✦</span>
  <span class="sparkle">✧</span>
  <span class="sparkle">✦</span>
  <span class="sparkle">✧</span>
  <span class="sparkle">✦</span>
</div>

<main class="page">

  <h1 class="page-title">
    天から届いた手紙
  </h1>

  <div class="envelope-stage">

    <div class="envelope" id="envelope">

      <div class="envelope-back"></div>

      <article class="letter">

        <div class="letter-content">

          <h2 class="letter-heading">
            あなたへのメッセージ
          </h2>

          <section class="section">

            <h3 class="section-title">
              キーワード
            </h3>

            <div
              class="keywords"
              id="keywords">
            </div>

          </section>

          <section class="section">

            <h3 class="section-title">
              天からの詳しいメッセージ
            </h3>

            <p
              class="meaning"
              id="meaning">
            </p>

          </section>

          <p class="signature">
            光より
          </p>

        </div>

      </article>

      <div class="envelope-front"></div>
      <div class="envelope-flap"></div>

      <div
        class="envelope-seal"
        aria-hidden="true">
        ✦
      </div>

      <p class="status" id="status">
        天からの手紙を受け取っています……
      </p>

    </div>

    <div class="letter-glow"></div>

  </div>

  <div class="buttons" id="buttons">

    <a
      class="button"
      id="backToCard"
      href="card.html">
      カードへ戻る
    </a>

    <a
      class="button secondary"
      href="index.html">
      Home
    </a>

  </div>

</main>

<script>
const CARD_COUNT = 44;

const params =
  new URLSearchParams(location.search);

const requestedCard =
  params.get("card") || "01";

const number =
  Number(requestedCard);

const cardNumber =
  Number.isInteger(number) &&
  number >= 1 &&
  number <= CARD_COUNT
    ? String(number).padStart(2,"0")
    : "01";

const envelope =
  document.getElementById("envelope");

const status =
  document.getElementById("status");

const keywordsElement =
  document.getElementById("keywords");

const meaningElement =
  document.getElementById("meaning");

const backToCard =
  document.getElementById("backToCard");

const buttons =
  document.getElementById("buttons");

backToCard.href =
  "card.html?card=" + cardNumber;

fetch("cards.json")
  .then(function(response){

    if(!response.ok){
      throw new Error(
        "cards.jsonを読み込めませんでした"
      );
    }

    return response.json();
  })

  .then(function(cards){

    const data =
      cards[cardNumber];

    if(!data){
      throw new Error(
        "このカードの解説は、まだ登録されていません"
      );
    }

    if(
      !Array.isArray(data.keywords) ||
      typeof data.meaning !== "string"
    ){
      throw new Error(
        "カードの登録内容を確認してください"
      );
    }

    keywordsElement.innerHTML = "";

    data.keywords.forEach(function(keyword){

      const span =
        document.createElement("span");

      span.className = "keyword";
      span.textContent = keyword;

      keywordsElement.appendChild(span);
    });

    meaningElement.textContent =
      data.meaning;

    status.classList.add("hide");

    /* 封が開く */
    setTimeout(function(){
      envelope.classList.add("open");
    },550);

    /* 手紙の文字が現れる */
    setTimeout(function(){
      envelope.classList.add(
        "show-content"
      );

      document.body.classList.add("warm");
    },1900);

    /* 最後に操作ボタンを表示 */
    setTimeout(function(){
      buttons.classList.add("show");
    },2450);
  })

  .catch(function(error){

    status.textContent =
      error.message;

    buttons.classList.add("show");
  });
</script>

</body>
</html>
