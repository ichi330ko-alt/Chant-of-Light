<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>天から届いた手紙｜光の詠唱</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  padding:34px 16px 46px;
  overflow-x:hidden;
  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(255,255,255,.96),
      transparent 43%
    ),
    linear-gradient(
      180deg,
      #faf5eb 0%,
      #eee0c9 100%
    );
  color:#554532;
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Noto Serif JP",
    serif;
}

.page{
  width:min(720px,100%);
  margin:0 auto;
  text-align:center;
}

.page-title{
  margin:0 0 25px;
  color:#8a6a38;
  font-size:clamp(22px,5vw,32px);
  font-weight:normal;
  letter-spacing:.16em;
  opacity:0;
  transform:translateY(10px);
  animation:titleFade 1.1s ease .2s forwards;
}

@keyframes titleFade{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* 封筒を置く空間 */
.envelope-stage{
  position:relative;
  width:min(650px,100%);
  min-height:680px;
  margin:0 auto;
  perspective:1600px;
}

/* 封筒本体 */
.envelope{
  position:absolute;
  left:50%;
  top:190px;
  width:94%;
  height:330px;
  transform:translateX(-50%);
}

/* 封筒の後ろ側 */
.envelope-back{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  border-radius:12px;
  background:
    linear-gradient(
      145deg,
      #d8ad62,
      #c99442
    );
  box-shadow:
    0 22px 48px rgba(78,51,19,.24);
}

/* 左右の折り返し */
.envelope-back::before,
.envelope-back::after{
  content:"";
  position:absolute;
  bottom:-40px;
  width:78%;
  height:120%;
  background:#e6c184;
}

.envelope-back::before{
  left:-28%;
  transform:rotate(34deg);
}

.envelope-back::after{
  right:-28%;
  transform:rotate(-34deg);
}

/* 下から重なる部分 */
.envelope-front{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:5;
  height:62%;
  overflow:hidden;
  border-radius:0 0 12px 12px;
}

.envelope-front::before,
.envelope-front::after{
  content:"";
  position:absolute;
  bottom:-70px;
  width:75%;
  height:155%;
  background:#edce95;
}

.envelope-front::before{
  left:-24%;
  transform:rotate(35deg);
}

.envelope-front::after{
  right:-24%;
  transform:rotate(-35deg);
}

/* 封筒のふた */
.envelope-flap{
  position:absolute;
  left:7%;
  top:0;
  z-index:7;
  width:86%;
  height:190px;
  background:
    linear-gradient(
      180deg,
      #d1a04f,
      #bb7f2b
    );
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transform:rotateX(0deg);
  transition:
    transform 1.15s cubic-bezier(.3,.72,.28,1),
    z-index 0s linear .55s;
  filter:drop-shadow(
    0 7px 8px rgba(80,49,14,.16)
  );
}

/* 開封後 */
.envelope.open .envelope-flap{
  z-index:0;
  transform:rotateX(180deg);
}

/* 便箋 */
.letter{
  position:absolute;
  left:50%;
  top:135px;
  z-index:3;
  width:88%;
  min-height:490px;
  padding:
    54px
    clamp(25px,7vw,62px)
    48px;
  opacity:0;
  transform:
    translateX(-50%)
    translateY(120px)
    rotate(-1deg)
    scale(.96);
  background:
    linear-gradient(
      rgba(255,255,255,.84),
      rgba(255,255,255,.84)
    ),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 37px,
      rgba(191,159,104,.1) 38px
    );
  border:1px solid #e5cf9e;
  box-shadow:
    0 16px 38px rgba(80,57,26,.2);
  transition:
    transform 1.35s cubic-bezier(.22,.78,.26,1),
    opacity .8s ease;
}

/* 便箋が上へ出る */
.envelope.open .letter{
  z-index:4;
  opacity:1;
  transform:
    translateX(-50%)
    translateY(-135px)
    rotate(-1deg)
    scale(1);
}

/* 金色の飾り枠 */
.letter::before{
  content:"";
  position:absolute;
  inset:14px;
  pointer-events:none;
  border:1px solid #d5af61;
}

.letter::after{
  content:"✦";
  position:absolute;
  top:3px;
  left:50%;
  padding:0 12px;
  background:#fffdf8;
  color:#c79a42;
  font-size:20px;
  transform:translateX(-50%);
}

.letter-content{
  opacity:0;
  transform:translateY(14px);
  transition:
    opacity 1s ease,
    transform 1s ease;
}

/* 便箋が出た後に文字を表示 */
.envelope.show-content .letter-content{
  opacity:1;
  transform:translateY(0);
}

.letter-heading{
  margin:0 0 34px;
  color:#9b7537;
  font-size:clamp(20px,5vw,28px);
  font-weight:normal;
  letter-spacing:.16em;
}

.section{
  margin:0 0 38px;
  text-align:left;
}

.section-title{
  margin:0 0 14px;
  padding-bottom:8px;
  border-bottom:
    1px solid rgba(181,139,72,.45);
  color:#a67a35;
  font-size:18px;
  font-weight:normal;
  letter-spacing:.12em;
}

.keywords{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:0;
}

.keyword{
  display:inline-block;
  padding:8px 15px;
  border:1px solid #d6b36d;
  border-radius:999px;
  background:rgba(255,250,238,.86);
  color:#72562f;
  font-size:15px;
}

.meaning{
  margin:0;
  color:#514535;
  font-size:clamp(16px,3.8vw,18px);
  line-height:2.15;
  text-align:justify;
  white-space:pre-wrap;
}

.signature{
  margin:42px 0 0;
  color:#9b7540;
  font-size:17px;
  letter-spacing:.18em;
  text-align:right;
}

.blessing{
  margin:34px 0 0;
  padding-top:24px;
  border-top:
    1px solid rgba(181,139,72,.3);
  color:#8b714b;
  font-size:15px;
  line-height:1.9;
  letter-spacing:.06em;
}

/* 読み込み中 */
.status{
  position:absolute;
  left:50%;
  top:50%;
  z-index:20;
  width:90%;
  margin:0;
  padding:20px;
  color:#71552e;
  font-size:16px;
  line-height:1.8;
  transform:translate(-50%,-50%);
}

.status.hide{
  display:none;
}

/* ボタン */
.buttons{
  margin-top:24px;
  opacity:0;
  transform:translateY(15px);
  transition:
    opacity .8s ease,
    transform .8s ease;
}

.buttons.show{
  opacity:1;
  transform:translateY(0);
}

.button{
  display:inline-block;
  margin:6px;
  padding:13px 23px;
  border:1px solid #b68b48;
  border-radius:999px;
  background:#c89c51;
  color:#fff;
  font:inherit;
  text-decoration:none;
  cursor:pointer;
}

.secondary{
  background:rgba(255,255,255,.55);
  color:#71552e;
}

@media(max-width:520px){

  body{
    padding:25px 9px 36px;
  }

  .envelope-stage{
    min-height:660px;
  }

  .envelope{
    top:180px;
    width:98%;
    height:300px;
  }

  .envelope-flap{
    height:165px;
  }

  .letter{
    top:125px;
    width:94%;
    min-height:475px;
    padding:45px 27px 38px;
  }

  .envelope.open .letter{
    transform:
      translateX(-50%)
      translateY(-125px)
      rotate(-1deg)
      scale(1);
  }

  .meaning{
    text-align:left;
  }
}

/* 動きを減らす設定 */
@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<body>

<main class="page">

  <h1 class="page-title">
    天から届いた手紙
  </h1>

  <div class="envelope-stage">

    <div class="envelope" id="envelope">

      <div class="envelope-back"></div>

      <article class="letter">

        <div class="letter-content">

          <h2 class="letter-heading">
            あなたへのメッセージ
          </h2>

          <section class="section">

            <h3 class="section-title">
              キーワード
            </h3>

            <div
              class="keywords"
              id="keywords">
            </div>

          </section>

          <section class="section">

            <h3 class="section-title">
              天からの詳しいメッセージ
            </h3>

            <p
              class="meaning"
              id="meaning">
            </p>

          </section>

          <p class="signature">
            光より
          </p>

          <p class="blessing">
            この言葉が、あなたの心に<br>
            静かな光を灯しますように。
          </p>

        </div>

      </article>

      <div class="envelope-front"></div>
      <div class="envelope-flap"></div>

      <p class="status" id="status">
        天からの手紙を受け取っています……
      </p>

    </div>

  </div>

  <div class="buttons" id="buttons">

    <a
      class="button"
      id="backToCard"
      href="card.html">
      カードへ戻る
    </a>

    <a
      class="button secondary"
      href="index.html">
      ホームへ戻る
    </a>

  </div>

</main>

<script>
const params =
  new URLSearchParams(location.search);

const requestedCard =
  params.get("card") || "01";

const number =
  Number(requestedCard);

const cardNumber =
  Number.isInteger(number) &&
  number >= 1 &&
  number <= 44
    ? String(number).padStart(2,"0")
    : "01";

const envelope =
  document.getElementById("envelope");

const status =
  document.getElementById("status");

const keywordsElement =
  document.getElementById("keywords");

const meaningElement =
  document.getElementById("meaning");

const backToCard =
  document.getElementById("backToCard");

const buttons =
  document.getElementById("buttons");

backToCard.href =
  "card.html?card=" + cardNumber;

fetch("cards.json")
  .then(function(response){

    if(!response.ok){
      throw new Error(
        "cards.jsonを読み込めませんでした"
      );
    }

    return response.json();
  })

  .then(function(cards){

    const data =
      cards[cardNumber];

    if(!data){
      throw new Error(
        "このカードの解説は、まだ登録されていません"
      );
    }

    keywordsElement.innerHTML = "";

    data.keywords.forEach(function(keyword){

      const span =
        document.createElement("span");

      span.className = "keyword";
      span.textContent = keyword;

      keywordsElement.appendChild(span);
    });

    meaningElement.textContent =
      data.meaning;

    status.classList.add("hide");

    /* 少し待って封筒を開く */
    setTimeout(function(){
      envelope.classList.add("open");
    },500);

    /* 便箋が出た後に文字を表示 */
    setTimeout(function(){
      envelope.classList.add(
        "show-content"
      );
    },1900);

    /* 最後にボタンを表示 */
    setTimeout(function(){
      buttons.classList.add("show");
    },2500);
  })

  .catch(function(error){

    status.textContent =
      error.message;

    buttons.classList.add("show");
  });
</script>

</body>
</html>
