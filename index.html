<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光の詠唱</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#06163d;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
}

/* 共通の透明リンク */
.hotspot{
  position:absolute;
  z-index:10;
  display:block;
  padding:0;
  border:0;
  border-radius:999px;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.hotspot:focus-visible{
  outline:4px solid rgba(255,238,194,.95);
  outline-offset:-4px;
  box-shadow:0 0 25px rgba(255,224,145,.8);
}

.hotspot:active{
  background:rgba(255,255,255,.10);
}

/* 最初のオープニング */
.intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at center,#173f87 0%,#0d295f 45%,#06163d 100%);
  opacity:1;
  visibility:visible;
  transition:opacity 1.05s ease,visibility 1.05s ease;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
}

.intro-title{
  margin:0;
  color:#f4d795;
  font-size:clamp(32px,8vw,58px);
  font-weight:normal;
  letter-spacing:.22em;
  opacity:0;
  transform:translateY(10px);
  animation:introTitle 1.2s ease .12s forwards;
}

@keyframes introTitle{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ---------- PC・タブレット ---------- */
.desktop-home{
  position:relative;
  width:min(100%,1024px);
  margin:0 auto;
  overflow:hidden;
  background:#f5ead4;
  box-shadow:0 0 50px rgba(0,0,0,.28);
}

.desktop-home img{
  display:block;
  width:100%;
  height:auto;
}

.desktop-home .draw{
  left:20.5%;
  top:37.25%;
  width:28.7%;
  height:5.6%;
}

.desktop-home .purify{
  left:51%;
  top:37.25%;
  width:28.7%;
  height:5.6%;
}

/* スマホ版は通常非表示 */
.mobile-home{
  display:none;
}

/* ---------- スマホ ---------- */
@media(max-width:620px){

  .desktop-home{
    display:none;
  }

  .mobile-home{
    display:block;
    width:100%;
    overflow:hidden;
    background:#f5ead4;
  }

  /*
    1画面目：
    home3-top.pngを画面いっぱいに表示。
    画像の縦横比に多少差があっても、上下左右の余白を作りません。
  */
  .mobile-hero{
    position:relative;
    width:100%;
    height:100svh;
    min-height:620px;
    overflow:hidden;
    background:#06163d;
  }

  .mobile-hero img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }

  /*
    home3-top.png内のボタン位置。
    画像上の白いボタンを、そのまま押せる透明リンクです。
  */
  .mobile-hero .draw{
    left:7.2%;
    top:65.7%;
    width:41.4%;
    height:8.1%;
  }

  .mobile-hero .purify{
    left:51.2%;
    top:65.7%;
    width:41.4%;
    height:8.1%;
  }

  /* 下へ続くことを静かに示す */
  .scroll-guide{
    position:absolute;
    left:50%;
    bottom:14px;
    z-index:12;
    margin:0;
    color:rgba(255,248,225,.86);
    font-size:12px;
    letter-spacing:.16em;
    transform:translateX(-50%);
    text-shadow:0 1px 8px rgba(0,0,0,.45);
    animation:scrollBreath 2.3s ease-in-out infinite;
  }

  .scroll-guide::before{
    content:"⌄";
    display:block;
    margin-bottom:2px;
    font-size:24px;
    line-height:1;
  }

  @keyframes scrollBreath{
    0%,100%{
      opacity:.45;
      transform:translate(-50%,0);
    }
    50%{
      opacity:1;
      transform:translate(-50%,5px);
    }
  }

  /*
    2画面目：
    PC用home3.pngの下半分だけを表示。
    画像が1024×1536のため、下半分は高さ75vwになります。
  */
  .mobile-information{
    position:relative;
    width:100%;
    height:75vw;
    overflow:hidden;
    background:#f5ead4;
  }

  .mobile-information img{
    position:absolute;
    top:-75vw;
    left:0;
    display:block;
    width:100%;
    height:auto;
  }

  .hotspot:focus-visible{
    outline-width:3px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<body>

<div class="intro" id="intro" aria-hidden="true">
  <h1 class="intro-title">光の詠唱</h1>
</div>

<!-- PC・タブレット -->
<main class="desktop-home">

  <img
    src="home3.png"
    alt="光の詠唱。今日の一枚、心の浄化、使い方の案内。">

  <button
    class="hotspot draw"
    id="desktopDrawButton"
    type="button"
    aria-label="今日の一枚を引く">
  </button>

  <a
    class="hotspot purify"
    href="purification.html"
    aria-label="心の浄化を開く">
  </a>

</main>

<!-- スマホ -->
<main class="mobile-home">

  <section class="mobile-hero">

    <img
      src="home3-top.png"
      alt="光の詠唱。宇宙の地平線と、今日の一枚・心の浄化への入口。">

    <button
      class="hotspot draw"
      id="mobileDrawButton"
      type="button"
      aria-label="今日の一枚を引く">
    </button>

    <a
      class="hotspot purify"
      href="purification.html"
      aria-label="心の浄化を開く">
    </a>

    <p class="scroll-guide">scroll</p>

  </section>

  <section class="mobile-information">
    <img
      src="home3.png"
      alt="光の詠唱の説明とはじめての方への使い方。">
  </section>

</main>

<script>
const CARD_COUNT = 44;

const intro =
  document.getElementById("intro");

window.addEventListener("load",function(){
  setTimeout(function(){
    intro.classList.add("hide");
  },1200);
});

function drawCard(){
  const number =
    Math.floor(Math.random()*CARD_COUNT)+1;

  const card =
    String(number).padStart(2,"0");

  location.href =
    "card.html?card="+card;
}

document
  .getElementById("desktopDrawButton")
  .addEventListener("click",drawCard);

document
  .getElementById("mobileDrawButton")
  .addEventListener("click",drawCard);
</script>

</body>
</html>
