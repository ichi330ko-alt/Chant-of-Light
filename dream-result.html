<main class="page"><header class="header"><img class="logo" src="logo.png" alt="光の詠唱のシンボル"><h1 class="title">夢の解き明かしの結果</h1><p class="subtitle">あなたの夢から、心へのメッセージをお届けします。</p></header><section id="resultArea" hidden><div class="result-grid"><aside class="panel card-panel"><p class="card-label">あなたの夢と響き合ったカード</p><img class="dream-card" id="dreamCard" src="" alt="夢から導かれた光の詠唱カード"><h2 class="card-title" id="cardTitle"></h2><div class="button-row"><a class="button" id="detailLink" href="#">カードの詳しいメッセージを見る</a></div></aside><div class="content"><article class="panel message-panel"><h2 class="section-title">夢からのメッセージ</h2><p class="message" id="message"></p></article><article class="panel question-panel"><h2 class="section-title">今日の問いかけ</h2><p class="question" id="question"></p></article></div></div><details class="original-dream"><summary>入力した夢を振り返る</summary><p id="originalDream"></p></details><div class="button-row"><a class="button secondary" href="dream.html">もう一度、夢を入力する</a><br><a class="button secondary" href="index.html">Home</a></div></section><section class="panel empty" id="emptyArea" hidden><p>夢の内容が見つかりませんでした。<br>入力画面から、もう一度お試しください。</p><a class="button" href="dream.html">夢を入力する</a></section></main>

<script>
"use strict";

const menuButton=document.getElementById("menuButton");
const globalNav=document.getElementById("globalNav");

menuButton.addEventListener("click",function(){
  const isOpen=globalNav.classList.toggle("open");
  menuButton.setAttribute("aria-expanded",String(isOpen));
  menuButton.textContent=isOpen ? "×" : "☰";
});

globalNav.addEventListener("click",function(event){
  if(event.target.tagName==="A"){
    globalNav.classList.remove("open");
    menuButton.setAttribute("aria-expanded","false");
    menuButton.textContent="☰";
  }
});

const RULES=[
{words:["虹","希望","光","朝日","晴れ","未来","叶う","願い"],cardId:2,title:"希望",message:"夢の中に現れた光や虹は、心の奥で希望が育っていることを表しているのかもしれません。\n\n今はまだ、答えや形がはっきりしていなくても大丈夫です。信じる気持ちを選ぶことで、疑いの雲は少しずつ晴れていきます。",question:"今日、あなたが信じることを選びたいものは何ですか？"},
{words:["海","川","水","雨","涙","湖","波","泳ぐ"],cardId:16,title:"癒し",message:"水の夢は、心の中を流れる感情と深く結びついています。\n\n抑えていた思いや疲れが、静かに外へ流れようとしているのかもしれません。無理に元気になろうとせず、今の気持ちをそのまま認めてあげてください。",question:"今のあなたが、やさしく受け止めてあげたい感情は何ですか？"},
{words:["道","橋","駅","電車","車","旅","歩く","進む","階段"],cardId:23,title:"一歩",message:"道や移動の夢は、人生の方向や変化を心が見つめているときに現れることがあります。\n\n進むことも戻ることも、どちらも大切な一歩です。周りの速さではなく、あなた自身の心が示す方向を選んでください。",question:"今日、無理なく踏み出せそうな小さな一歩は何ですか？"},
{words:["追われる","逃げる","怖い","襲われる","隠れる","怒られる","危険"],cardId:15,title:"境界線",message:"追われたり逃げたりする夢は、心が強い負担や緊張を感じている合図かもしれません。\n\nすべてに応えなくても大丈夫です。今のあなたには、自分を守る距離と静かな時間が必要なのかもしれません。",question:"今日、あなたが守ってあげたい自分の領域はどこですか？"},
{words:["亡くなった","死んだ","死ぬ","葬式","墓","別れ","消える"],cardId:22,title:"再生",message:"死や別れの夢は、現実の出来事を予告するものではありません。\n\n古い考え方や役割が終わり、新しい自分へ移ろうとする心の変化を表すことがあります。終わりは、次の始まりへ続いています。",question:"今のあなたが、静かに終わらせてもよいと思えるものは何ですか？"},
{words:["赤ちゃん","子ども","出産","妊娠","卵","芽","花"],cardId:9,title:"創造",message:"新しい命や芽吹きの夢は、あなたの中で何かが生まれ始めていることを表しているのかもしれません。\n\nまだ小さく不確かなものでも、急がずに育ててください。あなたの心が望む形を、自由に思い描いてよいのです。",question:"これから大切に育てていきたいものは何ですか？"},
{words:["家","実家","故郷","昔","学校","懐かしい","帰る"],cardId:41,title:"故郷",message:"懐かしい場所や家の夢は、心が安心できる原点を求めているときに現れることがあります。\n\n過去へ戻る必要はありません。ただ、かつてあなたを守ってくれた感覚を、今の生活にも少し取り戻してみてください。",question:"あなたが心から安心できる場所や時間は、どんなものですか？"},
{words:["空","飛ぶ","鳥","羽","雲","高い","上昇"],cardId:24,title:"挑戦",message:"空を飛ぶ夢は、制限を越えたい気持ちや、自由への願いを表しているのかもしれません。\n\n心が向かう先を恐れず、できる範囲で試してみてください。飛び立つ力は、すでにあなたの中にあります。",question:"今日、少しだけ自由に選んでみたいことは何ですか？"},
{words:["火","炎","燃える","爆発","雷","嵐","地震"],cardId:34,title:"流れ",message:"強い火や嵐の夢は、抑えきれない感情や大きな変化の力を表すことがあります。\n\nすべてを思いどおりに整えようとせず、まずは安全な場所で流れが落ち着くのを待ちましょう。変化の中にも、次へ進む道があります。",question:"今、無理に止めずに流れへ委ねてもよいことは何ですか？"},
{words:["猫","犬","動物","鳥","馬","魚","蛇","虫"],cardId:14,title:"本音",message:"動物は、言葉になる前の直感や本能を象徴することがあります。\n\n夢の中でその動物にどんな印象を抱いたでしょうか。好き、怖い、守りたいという感情の中に、今のあなたの本音が隠れているかもしれません。",question:"理屈を外したとき、あなたの心は本当は何を望んでいますか？"},
{words:["迷う","迷子","見つからない","探す","忘れる","遅刻","間に合わない"],cardId:1,title:"信頼",message:"迷ったり何かを探したりする夢は、心が方向や答えを求めているときに現れることがあります。\n\nすぐに正解を見つけなくても大丈夫です。今は見えない道も、あなたの内側にある感覚を信じることで少しずつ開いていきます。",question:"今、答えよりも自分を信じて待ってあげたいことは何ですか？"},
{words:["笑う","楽しい","嬉しい","祝う","結婚式","祭り","プレゼント"],cardId:3,title:"喜び",message:"喜びに満ちた夢は、心が本来の明るさを思い出しているのかもしれません。\n\n理由を探さず、うれしいと感じたことをそのまま受け取ってください。あなたの喜びは、周囲にもやさしい光を広げます。",question:"今日、あなたが素直に喜びたいことは何ですか？"}
];
const DEFAULTS=[{cardId:36,title:"時",message:"夢は、言葉にならない記憶や感情を静かに整理していることがあります。\n\n今すぐ意味を決めなくても大丈夫です。心に残った場面を急いで理解しようとせず、時間の中で意味が育つのを待ってみてください。",question:"この夢の中で、いちばん心に残っている感覚は何ですか？"},{cardId:14,title:"本音",message:"夢の物語は、普段は気づきにくい心の声を映しているのかもしれません。\n\n登場したものの意味を正しく当てるより、夢の中であなたがどう感じていたかを大切にしてください。その感情が、今の本音への入口になります。",question:"夢の中のあなたは、どんな気持ちを伝えようとしていましたか？"},{cardId:34,title:"流れ",message:"夢には、心の中で起きている変化が物語として現れることがあります。\n\nすべてを理解しようとせず、今の自分に響く部分だけを受け取ってください。心は必要な速さで、静かに次の場所へ向かっています。",question:"今日、流れに任せてみたいことは何ですか？"}];
function normalize(text){return text.toLowerCase().replace(/\s+/g,"")}function hashString(text){let hash=0;for(let i=0;i<text.length;i++){hash=((hash<<5)-hash)+text.charCodeAt(i);hash|=0}return Math.abs(hash)}function selectResult(text){const normalized=normalize(text);let bestRule=null,bestScore=0;RULES.forEach(function(rule){let score=0;rule.words.forEach(function(word){if(normalized.includes(word)){score+=word.length>=3?3:2}});if(score>bestScore){bestScore=score;bestRule=rule}});return bestRule||DEFAULTS[hashString(normalized)%DEFAULTS.length]}function pad(number){return String(number).padStart(2,"0")}
const dreamText=sessionStorage.getItem("chantDreamText"),resultArea=document.getElementById("resultArea"),emptyArea=document.getElementById("emptyArea");if(!dreamText){emptyArea.hidden=false}else{const result=selectResult(dreamText);document.getElementById("dreamCard").src="dream"+pad(result.cardId)+".png";document.getElementById("cardTitle").textContent=result.title;document.getElementById("message").textContent=result.message;document.getElementById("question").textContent=result.question;document.getElementById("originalDream").textContent=dreamText;document.getElementById("detailLink").href="detail.html?card="+pad(result.cardId);resultArea.hidden=false}
</script>
