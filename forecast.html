<!-- 惑星位置を計算するライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

<script>
/*
  心の天気予報
  自動判定エンジン
*/

const ASPECTS = {

  conjunction:{
    angle:0,
    label:"コンジャンクション"
  },

  sextile:{
    angle:60,
    label:"セクスタイル"
  },

  square:{
    angle:90,
    label:"スクエア"
  },

  trine:{
    angle:120,
    label:"トライン"
  },

  opposition:{
    angle:180,
    label:"オポジション"
  }
};


const BODY_NAMES = [
  "Sun",
  "Moon",
  "Mercury",
  "Venus",
  "Mars",
  "Jupiter",
  "Saturn",
  "Uranus",
  "Neptune",
  "Pluto"
];


function normalizeAngle(value){

  return (
    (value % 360) + 360
  ) % 360;
}


function angularDistance(a,b){

  const difference =
    Math.abs(
      normalizeAngle(a) -
      normalizeAngle(b)
    );

  return Math.min(
    difference,
    360 - difference
  );
}


function getBody(bodyName){

  if(
    typeof Astronomy === "undefined"
  ){
    throw new Error(
      "惑星計算ライブラリを読み込めませんでした。"
    );
  }

  const body =
    Astronomy.Body[bodyName];

  if(!body){
    throw new Error(
      "未対応の天体です：" +
      bodyName
    );
  }

  return body;
}


function getLongitude(bodyName,date){

  return normalizeAngle(

    Astronomy.EclipticLongitude(
      getBody(bodyName),
      date
    )
  );
}


function findAspect(
  longitudeA,
  longitudeB,
  orbSettings
){

  const distance =
    angularDistance(
      longitudeA,
      longitudeB
    );

  let bestAspect = null;

  Object
    .entries(ASPECTS)
    .forEach(function(entry){

      const name =
        entry[0];

      const information =
        entry[1];

      const allowedOrb =
        orbSettings[name];

      const error =
        Math.abs(
          distance -
          information.angle
        );

      if(
        error <= allowedOrb &&
        (
          !bestAspect ||
          error < bestAspect.error
        )
      ){

        bestAspect = {

          name:name,

          label:
            information.label,

          exactAngle:
            information.angle,

          actualAngle:
            distance,

          orb:error
        };
      }
    });

  return bestAspect;
}


function addScores(
  scoreBoard,
  scores
){

  Object
    .entries(scores || {})
    .forEach(function(entry){

      const weatherKey =
        entry[0];

      const points =
        Number(entry[1] || 0);

      scoreBoard[weatherKey] =
        (
          scoreBoard[weatherKey] ||
          0
        ) + points;
    });
}


async function loadJson(url){

  const response =
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      url +
      "を読み込めませんでした。"
    );
  }

  return response.json();
}


async function calculateForecast(){

  const date =
    new Date();

  const ruleData =
    await loadJson(
      "astrology-rules.json?v=3"
    );

  const longitudes = {};

  const scoreBoard = {};

  const matchedRules = [];


  BODY_NAMES.forEach(
    function(bodyName){

      longitudes[bodyName] =
        getLongitude(
          bodyName,
          date
        );
    }
  );


  ruleData.rules.forEach(
    function(rule){

      const aspect =
        findAspect(
          longitudes[rule.a],
          longitudes[rule.b],
          ruleData.settings.orb
        );

      if(
        aspect &&
        rule.aspects.includes(
          aspect.name
        )
      ){

        addScores(
          scoreBoard,
          rule.scores
        );

        matchedRules.push({

          name:
            rule.name,

          bodies:[
            rule.a,
            rule.b
          ],

          aspect:
            aspect,

          scores:
            rule.scores
        });
      }
    }
  );


  const rankedScores =
    Object
      .entries(scoreBoard)
      .sort(function(a,b){

        return b[1] - a[1];
      });


  const selectedWeather =
    rankedScores.length > 0

      ? rankedScores[0][0]

      : ruleData
          .settings
          .defaultWeather;


  return {

    weather:
      selectedWeather,

    scores:
      Object.fromEntries(
        rankedScores
      ),

    matchedRules:
      matchedRules,

    longitudes:
      longitudes,

    calculatedAt:
      date.toISOString()
  };
}
</script>


<script>
/*
  ページ表示
*/

const weatherElement =
  document.getElementById(
    "weather"
  );

const metaElement =
  document.getElementById(
    "meta"
  );

const commentElement =
  document.getElementById(
    "comment"
  );

const cardBox =
  document.getElementById(
    "cardBox"
  );

const cardNameElement =
  document.getElementById(
    "cardName"
  );

const cardLink =
  document.getElementById(
    "cardLink"
  );

const selector =
  document.getElementById(
    "demoSelector"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const details =
  document.getElementById(
    "details"
  );

const detailsList =
  document.getElementById(
    "detailsList"
  );


let weatherData = {};

let automaticResult = null;


function hashString(text){

  let hash = 0;

  for(
    let index = 0;
    index < text.length;
    index++
  ){

    hash =
      (
        (hash << 5) -
        hash
      ) +
      text.charCodeAt(index);

    hash |= 0;
  }

  return Math.abs(hash);
}


function todayKey(){

  const today =
    new Date();

  return [
    today.getFullYear(),
    today.getMonth() + 1,
    today.getDate()
  ].join("-");
}


function pickDaily(
  list,
  salt
){

  const index =
    hashString(
      todayKey() +
      salt
    ) %
    list.length;

  return list[index];
}


function renderWeather(
  weatherKey,
  mode
){

  const data =
    weatherData[weatherKey];

  if(!data){
    return;
  }

  const selectedCard =
    pickDaily(
      data.cards,
      weatherKey
    );


  weatherElement.textContent =
    data.label;


  metaElement.textContent =
    "主な影響：" +
    data.planets.join("・") +
    "　｜　テーマ：" +
    data.theme;


  commentElement.textContent =
    data.comment;


  cardNameElement.textContent =
    selectedCard.title;


  cardLink.href =
    "card.html?card=" +
    selectedCard.id;


  cardBox.hidden = false;


  statusElement.textContent =

    mode === "automatic"

      ? "今日の惑星配置から自動判定しました。"

      : "確認用の手動表示です。";
}


function renderDetails(result){

  detailsList.innerHTML = "";

  if(
    !result ||
    !result.matchedRules ||
    result.matchedRules.length === 0
  ){

    details.hidden = true;

    return;
  }


  result
    .matchedRules
    .slice(0,8)
    .forEach(function(rule){

      const listItem =
        document.createElement("li");

      listItem.textContent =
        rule.name +
        "（" +
        rule.aspect.label +
        "／誤差 " +
        rule.aspect.orb.toFixed(1) +
        "°）";

      detailsList.appendChild(
        listItem
      );
    });


  details.hidden = false;
}


async function startForecast(){

  try{

    weatherData =
      await loadJson(
        "weather.json?v=3"
      );


    Object
      .keys(weatherData)
      .forEach(function(weatherKey){

        const option =
          document.createElement(
            "option"
          );

        option.value =
          weatherKey;

        option.textContent =
          weatherData[
            weatherKey
          ].label;

        selector.appendChild(
          option
        );
      });


    automaticResult =
      await calculateForecast();


    renderWeather(
      automaticResult.weather,
      "automatic"
    );


    renderDetails(
      automaticResult
    );


    selector.addEventListener(
      "change",
      function(){

        if(
          selector.value === ""
        ){

          renderWeather(
            automaticResult.weather,
            "automatic"
          );

          renderDetails(
            automaticResult
          );

          return;
        }


        renderWeather(
          selector.value,
          "manual"
        );


        details.hidden = true;
      }
    );
  }


  catch(error){

    weatherElement.textContent =
      "表示できませんでした";


    statusElement.textContent =
      "読み込みに失敗しました。";


    commentElement.textContent =
      error.message;


    console.error(error);
  }
}


startForecast();
</script>
